  <style>

    .example-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.example{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;min-width:0}.example-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.example-tag{font-size:11px;color:var(--mint);font-weight:850}.example-en{direction:ltr;text-align:left;font-size:clamp(17px,2.8vw,21px);font-weight:850;line-height:1.5;margin:13px 0;color:#fff;overflow-wrap:anywhere}.example-ar{color:#d0dced;font-size:14px;margin:6px 0 0}.example-ar[hidden]{display:none}.reveal{border:1px solid #4a5b7a;color:#dfeaff;background:#22324b;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:800}
    .mistake{border-color:#704957;background:linear-gradient(145deg,#302237,#1e263b)}.mistake-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mistake-side{border-radius:14px;padding:13px;background:#111b2caa;border:1px solid #ffffff12}.mistake-side small{display:block;font-weight:900;font-size:11px;margin-bottom:7px}.mistake-side.wrong small{color:var(--red)}.mistake-side.correct small{color:var(--mint)}.mistake-text{direction:ltr;text-align:left;unicode-bidi:plaintext;font-weight:850;font-size:16px;line-height:1.55;overflow-wrap:anywhere}.why{color:#ced8e8;font-size:13px;margin:12px 0 0;line-height:1.8}
    .tip-card{display:flex;gap:13px;align-items:flex-start;border-color:#796443;background:linear-gradient(145deg,#3b3429,#1b293c)}.tip-icon{font-size:24px}.tip-card p{margin:0;color:#f2dfbd;line-height:1.85;font-weight:700}
    .quiz-card{border-color:#4b5180;background:radial-gradient(circle at 100% 0%,#8375ed20,transparent 42%),linear-gradient(145deg,#202543,#172b41)}.quiz-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.quiz-count{font-size:12px;color:var(--mint);font-weight:900}.quiz-track{height:8px;border-radius:99px;background:#34415a;overflow:hidden;margin:12px 0 20px}.quiz-track i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),var(--purple));transition:width .2s}.question{font-size:clamp(17px,3vw,21px);font-weight:850;margin:12px 0 17px;line-height:1.6}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.option{min-height:55px;min-width:0;border:1px solid #455777;background:#263651;color:#eff4ff;border-radius:13px;padding:10px;font-weight:800;overflow-wrap:anywhere}.option:hover:not(:disabled){border-color:var(--purple);background:#31375c}.option.good{border-color:var(--mint);background:#164c46;color:#d9fff3}.option.bad{border-color:var(--red);background:#512b3d;color:#ffe3ea}.option:disabled{cursor:default;opacity:1}.feedback{margin-top:14px;padding:13px 14px;border-radius:13px;background:#112d31;border:1px solid #2c7467;color:#d9fff3;font-size:13px;line-height:1.8}.feedback.bad{background:#3b2635;border-color:#885065;color:#ffe2e9}.quiz-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}.quiz-footer button:disabled{opacity:.35;cursor:not-allowed}.quiz-result{text-align:center;padding:20px 5px}.quiz-result .score{font-size:45px;font-weight:1000;color:var(--mint);line-height:1.3}.quiz-result h3{margin:7px 0}.quiz-result p{color:var(--muted);margin:4px 0 16px}
    .bottom-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}.lesson-neighbor{display:flex;flex-direction:column;gap:3px;text-decoration:none;border:1px solid var(--line);background:#19263e;border-radius:14px;padding:10px 13px;min-width:0;max-width:48%}.lesson-neighbor small{font-size:10px;color:var(--muted)}.lesson-neighbor strong{font-size:13px;overflow-wrap:anywhere}.lesson-neighbor.next{margin-right:auto;text-align:left}.note{color:var(--muted);font-size:11px;line-height:1.8;text-align:center;margin:22px 0 0}

    @media(max-width:680px){.wrap{width:min(100% - 22px,900px);padding-top:12px}.topbar{align-items:flex-start}.brand{font-size:14px}.brand-mark{width:38px;height:38px}.back-link,.home-link{padding:8px 10px;font-size:11px}.hero{border-radius:22px}.route{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.route button{font-size:11px;padding:9px 8px}.step-grid,.example-grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.mistake-grid{grid-template-columns:1fr}.section{margin-top:21px}.concept{gap:10px}.concept-emoji{width:40px;height:40px;flex-basis:40px}.bottom-nav{align-items:stretch}.lesson-neighbor{max-width:49%;padding:9px}.lesson-neighbor strong{font-size:12px}.step-controls{padding:10px}.step-controls button{min-width:0;flex:1}.step-controls span{max-width:76px}.lesson-stages{min-height:240px}}
    @media(max-width:360px){.topbar{flex-direction:column}.top-actions{width:100%}.back-link,.home-link{flex:1;text-align:center}.route a{padding:8px 7px}.section-head{gap:9px}.section-icon{width:36px;height:36px;flex-basis:36px}}

<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">E</span><span>English Hero <small style="display:block;color:var(--muted);font-size:10px;font-weight:600">تعلّم خطوة بخطوة</small></span></div>
      <div class="top-actions">
        <button class="back-link" id="backButton" type="button">→ العودة للقائمة</button>
        <a class="home-link" href="./index.html">الرئيسية</a>
      </div>
    </header>

    <div id="lessonRoot">
      <section class="not-found"><h1>جارٍ فتح الدرس…</h1><p>نجهّز لك الشرح والأمثلة والتحدي.</p></section>
    </div>
  </main>

  <script src="./grammar-lessons.js?v=3"></script>
  <script>
    (function () {
      'use strict';
      const $ = id => document.getElementById(id);
      const root = $('lessonRoot');
      const safeText = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text);
        return node;
      };
      let activeLesson = null;

      function showMissing() {
        root.replaceChildren();
        const panel = safeText('section','not-found');
        panel.append(safeText('h1','', 'لم نعثر على هذا الدرس'));
        panel.append(safeText('p','', 'ارجع إلى فهرس القواعد والأزمنة واختر الدرس الذي تريد تعلمه.'));
        const link = safeText('a','btn primary','العودة إلى بطل الإنجليزي');
        link.href = './index.html';
        link.style.display = 'inline-block';
        link.style.textDecoration = 'none';
        panel.append(link);
        root.append(panel);
        document.title = 'الدرس غير متاح | English Hero';
      }

      function makeSection(id, icon, title, subtitle) {
        const section = safeText('section','section');
        section.id = id;
        const head = safeText('div','section-head');
        head.append(safeText('span','section-icon',icon));
        const copy = document.createElement('div');
        copy.append(safeText('h2','',title),safeText('p','',subtitle));
        head.append(copy);
        section.append(head);
        return section;
      }

      function renderExamples(examples) {
        const section = makeSection('examples','💬','شاهد القاعدة داخل جملة','اقرأ الجملة الإنجليزية أولًا، ثم اكشف معناها العربي.');
        const grid = safeText('div','example-grid');
        examples.forEach((item,index) => {
          const card = safeText('article','example');
          const top = safeText('div','example-top');
          top.append(safeText('span','example-tag','مثال '+(index+1)));
          if (item.focus) top.append(safeText('span','pill',item.focus));
          const english = safeText('p','example-en',item.en);
          english.dir = 'ltr';
          const reveal = safeText('button','reveal','أظهر الترجمة');
          reveal.type = 'button';
          reveal.setAttribute('aria-expanded','false');
          const arabic = safeText('p','example-ar',item.ar);
          arabic.hidden = true;
          reveal.addEventListener('click',() => {
            arabic.hidden = !arabic.hidden;
            reveal.textContent = arabic.hidden ? 'أظهر الترجمة' : 'أخفِ الترجمة';
            reveal.setAttribute('aria-expanded',String(!arabic.hidden));
          });
          card.append(top,english,reveal,arabic);
          grid.append(card);
        });
        section.append(grid);
        return section;
      }

      function renderQuiz(questions) {
        const section = makeSection('challenge','🎯','تحدّي القاعدة','ثلاث جولات قصيرة. اختر إجابتك، واعرف السبب فورًا.');
        const panel = safeText('div','quiz-card');
        const header = safeText('div','quiz-header');
        const label = safeText('span','quiz-count','تحدّي البطل');
        const counter = safeText('span','quiz-count','');
        const track = safeText('div','quiz-track');
        const fill = document.createElement('i');
        track.append(fill);
        header.append(label,counter);
        const question = safeText('h3','question','');
        const options = safeText('div','options');
        const feedback = safeText('div','feedback','');
        feedback.hidden = true;
        feedback.setAttribute('aria-live','polite');
        const footer = safeText('div','quiz-footer');
        const score = safeText('span','quiz-count','');
        const next = safeText('button','btn primary','السؤال التالي ←');
        next.type = 'button';
        next.disabled = true;
        footer.append(score,next);
        panel.append(header,track,question,options,feedback,footer);
        section.append(panel);

        let index = 0;
        let points = 0;
        let answered = false;

        function finish() {
          panel.replaceChildren();
          const result = safeText('div','quiz-result');
          result.append(safeText('div','score',points+' / '+questions.length));
          result.append(safeText('h3','',points === questions.length ? 'أبدعت! إجابات كاملة 🌟' : points >= 2 ? 'أحسنت! تقدّم جميل 👏' : 'بداية جيدة، أعد المحاولة 💪'));
          result.append(safeText('p','', 'هذه نتيجة تدريب قصير وليست حكمًا نهائيًا على إتقان القاعدة. راجع الشرح ثم جرّب مرة أخرى.'));
          const restart = safeText('button','btn primary','إعادة التحدي');
          restart.type = 'button';
          restart.addEventListener('click',() => { index = 0; points = 0; answered = false; panel.replaceChildren(); renderQuizInto(panel,questions); });
          result.append(restart);
          panel.append(result);
        }

        function renderQuizInto(target,items) {
          const qhead = safeText('div','quiz-header');
          const qlabel = safeText('span','quiz-count','تحدّي البطل');
          const qcounter = safeText('span','quiz-count','');
          const qtrack = safeText('div','quiz-track');
          const qfill = document.createElement('i');
          qtrack.append(qfill);
          const qtext = safeText('h3','question','');
          const qoptions = safeText('div','options');
          const qfeedback = safeText('div','feedback','');
          qfeedback.hidden = true;
          qfeedback.setAttribute('aria-live','polite');
          const qfooter = safeText('div','quiz-footer');
          const qscore = safeText('span','quiz-count','');
          const qnext = safeText('button','btn primary','السؤال التالي ←');
          qhead.append(qlabel,qcounter);
          qnext.type='button'; qnext.disabled=true;
          qfooter.append(qscore,qnext);
          target.append(qhead,qtrack,qtext,qoptions,qfeedback,qfooter);

          function draw() {
            answered=false;
            const item=items[index];
            qcounter.textContent='السؤال '+(index+1)+' من '+items.length;
            qfill.style.width=(index/items.length*100)+'%';
            qtext.textContent=item.text;
            qoptions.replaceChildren();
            qfeedback.hidden=true;
            qfeedback.textContent='';
            qfeedback.classList.remove('bad');
            qscore.textContent='إجابات صحيحة: '+points;
            qnext.disabled=true;
            items[index].options.forEach((option,optionIndex)=>{
              const button=safeText('button','option',option);
              button.type='button';
              button.addEventListener('click',()=>{
                if(answered)return;
                answered=true;
                const correct=optionIndex===item.answer;
                if(correct)points++;
                qoptions.querySelectorAll('button').forEach((choice,i)=>{
                  choice.disabled=true;
                  if(i===item.answer)choice.classList.add('good');
                  else if(i===optionIndex&&!correct)choice.classList.add('bad');
                });
                qfeedback.textContent=(correct?'✅ صحيح! ':'💡 ليست الإجابة الصحيحة. ')+item.explain;
                qfeedback.classList.toggle('bad',!correct);
                qfeedback.hidden=false;
                qscore.textContent='إجابات صحيحة: '+points;
                qnext.disabled=false;
                qfill.style.width=((index+1)/items.length*100)+'%';
              });
              qoptions.append(button);
            });
          }
          qnext.addEventListener('click',()=>{
            if(!answered)return;
            index++;
            if(index>=items.length){finish();return;}
            draw();
          });
          draw();
        }

        panel.replaceChildren();
        renderQuizInto(panel,questions);
        return section;
      }

const formulaArabic = {
'Subject + verb':'Subject (الفاعل: من يقوم بالفعل) + verb (الفعل الذي يقوم به الفاعل).',
'Subject + am / is / are + noun / adjective / place':'Subject (الفاعل) + am (أكون مع I) / is (يكون مع he أو she أو it) / are (تكون أو يكونون مع you أو we أو they) + noun (اسم) / adjective (صفة) / place (مكان).',
'I / you / we / they + base verb — he / she / it + verb-s':'I (أنا) / you (أنت) / we (نحن) / they (هم) + base verb (الفعل بصورته الأساسية) — he (هو) / she (هي) / it (لغير العاقل) + verb-s (الفعل مع s أو es).',
'Subject + am / is / are + verb-ing':'Subject (الفاعل) + am (أكون) / is (يكون) / are (تكون أو يكونون) + verb (الفعل) + -ing (لاحقة تُضاف إلى الفعل لتكوين صيغة المستمر).',
'Subject + past verb — negative: did not + base verb':'Subject (الفاعل) + past verb (الفعل بصيغة الماضي) — negative (النفي): did (فعل مساعد للماضي) + not (لا) + base verb (الفعل بصورته الأساسية).',
'Subject + was / were + verb-ing':'Subject (الفاعل) + was (كان للمفرد) / were (كانوا أو كنتم) + verb (الفعل) + -ing (لاحقة تدل على استمرار الفعل في الماضي).',
'Subject + will + base verb':'Subject (الفاعل) + will (سوف) + base verb (الفعل بصورته الأساسية).',
'Subject + am / is / are + going to + base verb':'Subject (الفاعل) + am (أكون) / is (يكون) / are (تكون أو يكونون) + going to (تركيب يدل على خطة أو نية مستقبلية) + base verb (الفعل بصورته الأساسية).',
'Subject + have / has + past participle':'Subject (الفاعل) + have (فعل مساعد مع I / you / we / they) / has (فعل مساعد مع he / she / it) + past participle (التصريف الثالث للفعل).',
'Question word + auxiliary / be + subject + ...?':'Question word (أداة السؤال مثل what أو where) + auxiliary (فعل مساعد) / be (أحد أشكال فعل be) + subject (الفاعل) + بقية السؤال؟',
'a + singular noun — an + vowel sound — the + specific noun':'a (أداة نكرة قبل صوت ساكن) + singular noun (اسم مفرد) — an (أداة نكرة قبل صوت متحرك) + vowel sound (صوت حرف علة) — the (أداة تعريف) + specific noun (اسم محدد ومعروف).',
'at + clock time — on + day/date — in + month/year/period':'at (حرف جر يُستخدم مع) + clock time (وقت الساعة) — on (حرف جر يُستخدم مع) + day/date (يوم أو تاريخ) — in (حرف جر يُستخدم مع) + month/year/period (شهر أو سنة أو فترة).',
'many + countable plural — much + uncountable — a lot of + both':'many (كثير من) + countable plural (أسماء معدودة بصيغة الجمع) — much (كثير من) + uncountable (اسم غير معدود) — a lot of (الكثير من) + both (كلا النوعين: المعدود وغير المعدود).',
'like + verb-ing — like + to + base verb':'like (يحب) + verb-ing (الفعل مضافًا إليه ing) — like (يحب) + to (أداة تأتي قبل) + base verb (الفعل بصورته الأساسية).',
'short adjective + -er + than — more + long adjective + than':'short adjective (صفة قصيرة) + -er (نهاية للمقارنة) + than (من) — more (أكثر) + long adjective (صفة طويلة) + than (من).',
'verb + adverb — often adjective + -ly':'verb (الفعل) + adverb (ظرف يوضح كيف حدث الفعل) — often (غالبًا) adjective (صفة) + -ly (نهاية تُضاف غالبًا للصفة لتكوين ظرف).',
'I / you / we / they + don’t + base verb — he / she / it + doesn’t + base verb':'I (أنا) / you (أنت) / we (نحن) / they (هم) + don’t (لا) + base verb (الفعل بصورته الأساسية) — he (هو) / she (هي) / it (لغير العاقل) + doesn’t (لا) + base verb (الفعل بصورته الأساسية).',
'Do / Does + subject + base verb + ...?':'Do (فعل مساعد مع I / you / we / they) / Does (فعل مساعد مع he / she / it) + subject (الفاعل) + base verb (الفعل بصورته الأساسية) + بقية السؤال؟',
'There is + singular — There are + plural':'There is (يوجد للمفرد) + singular (مفرد) — There are (يوجد للجمع) + plural (جمع).',
'I / you / we / they + have — he / she / it + has':'I (أنا) / you (أنت) / we (نحن) / they (هم) + have (لديّ/لديك/لدينا/لديهم) — he (هو) / she (هي) / it (لغير العاقل) + has (لديه/لديها).',
'possessive adjective + noun':'possessive adjective (صفة ملكية مثل my أو your أو his أو her أو our أو their) + noun (اسم).',
'verb / preposition + object pronoun':'verb (فعل) / preposition (حرف جر) + object pronoun (ضمير مفعول به مثل me أو him أو her).',
'some: often in affirmative / offers — any: often in negatives and questions':'some (بعض) تُستخدم غالبًا في affirmative (الجمل المثبتة) وoffers (العروض) — any (أي/بعض) تُستخدم غالبًا في negatives (الجمل المنفية) وquestions (الأسئلة).',
'preposition of place + noun':'preposition of place (حرف جر يحدد المكان مثل in أو on أو under) + noun (اسم).',
'subject + can / can’t + base verb':'subject (الفاعل) + can (يستطيع) / can’t (لا يستطيع) + base verb (الفعل بصورته الأساسية).',
'must / should + base verb':'must (يجب: إلزام) / should (ينبغي: نصيحة) + base verb (الفعل بصورته الأساسية).',
'base verb + ... — negative: Don’t + base verb':'base verb (الفعل بصورته الأساسية) + بقية الجملة — negative (النهي): Don’t (لا) + base verb (الفعل بصورته الأساسية).',
'result + because + reason — reason + so + result':'result (النتيجة) + because (لأن) + reason (السبب) — reason (السبب) + so (لذلك) + result (النتيجة).',
'one = singular noun replacement — ones = plural noun replacement':'one (ضمير يحل محل اسم مفرد) = singular noun (اسم مفرد) replacement (بديل) — ones (ضمير يحل محل اسم جمع) = plural noun (اسم جمع) replacement (بديل).',
'too + adjective — adjective + enough — enough + noun':'too (أكثر من اللازم) + adjective (صفة) — adjective (صفة) + enough (بدرجة كافية) — enough (كمية كافية من) + noun (اسم).',
'enjoy + verb-ing':'enjoy (يستمتع) + verb (الفعل) + -ing (لاحقة تجعل الفعل هنا بصيغة ing).',
'If + present simple, will + base verb':'If (إذا) + present simple (المضارع البسيط) ، will (سوف) + base verb (الفعل بصورته الأساسية).',
'subject + be (correct tense) + past participle':'subject (الفاعل) + be (فعل be: am / is / are / was / were) (بالتصريف المناسب للزمن) + past participle (التصريف الثالث للفعل).',
'person + who / thing + which — that can refer to people or things':'person (شخص) + who (الذي/التي للأشخاص) / thing (شيء) + which (الذي/التي للأشياء) — that (الذي/التي، وقد تُستخدم للأشخاص والأشياء).',
'said (that) + reported clause':'said (قال) + that (أنّ) + reported clause (الجملة التي تنقل كلام الشخص).',
'verb + particle (adverb / preposition) = a new meaning':'verb (فعل) + particle (كلمة تأتي مع الفعل) (adverb: ظرف / preposition: حرف جر) = a new meaning (معنى جديد).',
'past verb — negative / question: did + base verb':'past verb (الفعل بصيغة الماضي) — negative (النفي) / question (السؤال): did (فعل مساعد للماضي) + base verb (الفعل بصورته الأساسية).',
'had + past participle':'had (فعل مساعد للماضي التام: كان قد) + past participle (التصريف الثالث للفعل).',
'will + base verb':'will (سوف) + base verb (الفعل بصورته الأساسية).',
'am / is / are + going to + base verb':'am (أكون) / is (يكون) / are (تكون أو يكونون) + going to (تركيب يدل على خطة أو نية مستقبلية) + base verb (الفعل بصورته الأساسية).',
'will be + verb-ing':'will (سوف) + be (يكون) + verb (الفعل) + -ing (لاحقة تدل على أن الفعل سيكون مستمرًا في وقت مستقبلي).',
'had been + verb-ing':'had (فعل مساعد للماضي التام) + been (التصريف الثالث من be) + verb (الفعل) + -ing (للدلالة على استمرار النشاط قبل نقطة ماضية).',
'will have + past participle':'will (سوف) + have (فعل مساعد ثابت) + past participle (التصريف الثالث للفعل)؛ أي أن الفعل سيكون قد اكتمل قبل وقت مستقبلي.',
'will have been + verb-ing':'will (سوف) + have (فعل مساعد) + been (التصريف الثالث من be) + verb (الفعل) + -ing (للدلالة على مدة الاستمرار حتى وقت مستقبلي).',
'have / has been + verb-ing':'have (فعل مساعد مع I / you / we / they) / has (فعل مساعد مع he / she / it) + been (التصريف الثالث من be) + verb (الفعل) + -ing (لاحقة تدل على الاستمرار).',
'am / is / are + verb-ing':'am (أكون) / is (يكون) / are (تكون أو يكونون) + verb (الفعل) + -ing (لاحقة تُضاف إلى الفعل لتكوين صيغة المستمر).',
'was / were + verb-ing':'was (كان للمفرد) / were (كانوا أو كنتم) + verb (الفعل) + -ing (لاحقة تدل على استمرار الفعل في الماضي).',
'have / has + past participle':'have (فعل مساعد مع I / you / we / they) / has (فعل مساعد مع he / she / it) + past participle (التصريف الثالث للفعل).'
};
      function renderLesson() {
        const slug = decodeURIComponent(location.hash.replace(/^#/,'').trim());
        const data = window.EnglishHeroLessons;
        activeLesson = data && Array.isArray(data.all) ? data.all.find(item=>item.slug===slug) : null;
        if(!activeLesson){showMissing();return;}

        const collection=activeLesson.type==='tense'?data.tenses:data.grammar;
        const currentIndex=collection.findIndex(item=>item.slug===activeLesson.slug);
        const previous=collection[currentIndex-1];
        const following=collection[currentIndex+1];
        document.title=activeLesson.title+' | English Hero';

        root.replaceChildren();
        const hero=safeText('section','hero');
        const meta=safeText('div','hero-meta');
        meta.append(safeText('span','eyebrow',activeLesson.type==='tense'?'ENGLISH TENSE':'ENGLISH GRAMMAR'));
        meta.append(safeText('span','pill',activeLesson.level));
        meta.append(safeText('span','pill','⏱ '+activeLesson.minutes+' دقائق'));
        hero.append(meta,safeText('h1','',activeLesson.title),safeText('p','hero-summary',activeLesson.summary));
        const actions=safeText('div','hero-actions');
        const start=safeText('button','btn primary','ابدأ التعلّم ↓');
        start.type='button';
        start.addEventListener('click',()=>document.getElementById('concept')?.scrollIntoView({behavior:'smooth',block:'start'}));
        const indexLink=safeText('a','btn secondary','الرئيسية');
        indexLink.href='./index.html';
        actions.append(start,indexLink);
        hero.append(actions);
        root.append(hero);

        const stepNames=['افهم الفكرة','تفصيل القاعدة','ابنِ الجملة','شاهد الأمثلة','صحّح الخطأ','تذكّر النصيحة','اختبر نفسك'];
        const route=safeText('nav','route');
        route.id='lessonSteps';
        route.setAttribute('aria-label','مراحل تعلّم الدرس');
        const stageContainer=safeText('div','lesson-stages');
        const stageElements=[],stepButtons=[];
        const status=safeText('div','step-status','الخطوة 1 من 7 • افهم الفكرة');
        status.id='lessonStepStatus';status.setAttribute('role','status');status.setAttribute('aria-live','polite');
        const progress=safeText('div','step-progress');
        progress.setAttribute('role','progressbar');
        progress.setAttribute('aria-label','تقدّمك في خطوات الدرس');
        progress.setAttribute('aria-valuemin','1');
        progress.setAttribute('aria-valuemax','7');
        const progressFill=document.createElement('i');
        progress.append(progressFill);
        const controls=safeText('div','step-controls');
        const previousStep=safeText('button','step-back','→ السابق');
        previousStep.type='button';previousStep.disabled=true;
        const controlHint=safeText('span','','خذ كل خطوة على مهل');
        const nextStep=safeText('button','btn primary','التالي ←');
        nextStep.type='button';
        controls.append(previousStep,controlHint,nextStep);
        let currentStep=0;
        function setActiveStep(index,scroll=true){
          currentStep=Math.max(0,Math.min(stepNames.length-1,index));
          stageElements.forEach((stage,i)=>{stage.classList.add('lesson-stage');stage.hidden=i!==currentStep;});
          stepButtons.forEach((button,i)=>{if(i===currentStep)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});
          status.textContent='الخطوة '+(currentStep+1)+' من '+stepNames.length+' • '+stepNames[currentStep];
          progressFill.style.width=((currentStep+1)/stepNames.length*100)+'%';
          progress.setAttribute('aria-valuenow',String(currentStep+1));
          previousStep.disabled=currentStep===0;
          nextStep.disabled=currentStep===stepNames.length-1;
          nextStep.textContent=currentStep===stepNames.length-1?'وصلت إلى التحدّي':'التالي ←';
          controlHint.textContent=currentStep===stepNames.length-1?'أجب عن الأسئلة لتعرف ما تحتاج إلى مراجعته':'أنجز هذه الخطوة ثم انتقل إلى التالية';
          if(scroll)stageContainer.scrollIntoView({behavior:'smooth',block:'start'});
        }
        stepNames.forEach((name,index)=>{
          const button=safeText('button','', '');
          button.type='button';button.setAttribute('data-step-index',String(index));
          button.append(safeText('span','',String(index+1)),safeText('span','',name));
          button.addEventListener('click',()=>setActiveStep(index));
          stepButtons.push(button);route.append(button);
        });
        previousStep.addEventListener('click',()=>setActiveStep(currentStep-1));
        nextStep.addEventListener('click',()=>setActiveStep(currentStep+1));
        root.append(route,status,progress,stageContainer);

        const concept=makeSection('concept','💡','أولًا: افهم الفكرة','اربط القاعدة بموقف تعرفه من حياتك.');
        const conceptCard=safeText('div','concept');
        conceptCard.append(safeText('span','concept-emoji','🧠'));
        const conceptCopy=document.createElement('div');
        conceptCopy.append(safeText('h3','','تخيّل هذا الموقف'),safeText('p','',activeLesson.everyday));
        conceptCard.append(conceptCopy);concept.append(conceptCard);stageElements.push(concept);stageContainer.append(concept);

        const guide=activeLesson.guide;
        if(!guide || !guide.idea || !guide.use || !Array.isArray(guide.build) || !guide.compare || !guide.watch){
          throw new Error('شرح تفصيلي غير مكتمل للدرس: '+activeLesson.slug);
        }
        const deepSection=makeSection('deep-guide','🔎','ثانيًا: فكّك القاعدة وافهم تفاصيلها','لا تحفظ الشكل فقط؛ افهم متى تستخدمه، وكيف تُبنى الجملة، وما الفرق بينه وبين قاعدة قريبة.');
        const deepGrid=safeText('div','guide-grid');
        const addGuideCard=(title,body,kind='')=>{
          const card=safeText('article','guide-card'+(kind?' '+kind:''));
          card.append(safeText('h3','',title));
          if(Array.isArray(body)){
            const list=safeText('ul','');
            body.forEach(line=>list.append(safeText('li','',line)));
            card.append(list);
          }else card.append(safeText('p','',body));
          deepGrid.append(card);
        };
        addGuideCard('💡 الفكرة ببساطة',guide.idea);
        addGuideCard('🕒 متى أستخدمها؟',guide.use);
        addGuideCard('🧱 نفكّكها خطوة خطوة',guide.build);
        addGuideCard('⚖️ لا تخلط بينها وبين غيرها',guide.compare,'compare');
        addGuideCard('🚧 انتبه لهذا التفصيل',guide.watch,'warning');
        deepSection.append(deepGrid);stageElements.push(deepSection);stageContainer.append(deepSection);

        const formula=makeSection('formula','🧩','ثانيًا: ابنِ الجملة','احفظ شكل الجملة بعد أن تفهم لماذا نستخدمه.');
        const formulaCard=safeText('div','formula-card');
        formulaCard.append(safeText('span','formula-label','شكل القاعدة'));
        const formulaText=safeText('div','formula',activeLesson.formula);
        formulaText.dir='ltr';
        formulaCard.append(formulaText);
        const formulaAr=safeText('p','formula-ar',activeLesson.slug==='g-present-simple'?'الفاعل هو من يقوم بالفعل. مع I / you / we / they نستخدم الفعل كما هو. مع he / she / it أو اسم مفرد نضيف علامة s إلى الفعل في الجملة المثبتة. في النفي والسؤال نستخدم does، لذلك يعود الفعل بعدها إلى صورته الأساسية دون s.':(formulaArabic[activeLesson.formula]||'اقرأ الصيغة من اليسار إلى اليمين، ثم راجع معنى كل جزء في الخطوات التالية.'));
        formulaCard.append(formulaAr);formula.append(formulaCard);
        const steps=safeText('div','step-grid');
        const lessonSteps=activeLesson.slug==='g-present-simple'?[
          'أولًا: ما معنى المضارع البسيط؟ نستخدمه للعادة والروتين والحقائق؛ مثل شيء تفعله كل يوم أو حقيقة معروفة. مثال: I drink water every day = أشرب الماء كل يوم.',
          'قبل اختيار شكل الفعل، حدّد الفاعل: من الذي يقوم بالفعل؟ I = أنا، you = أنت/أنتم، we = نحن، they = هم. هذه المجموعة لا نضيف معها s إلى الفعل.',
          'المجموعة الثانية: he = هو، she = هي، it = هو/هي لشيء أو حيوان، وكذلك أي اسم مفرد مثل Ali أو my mother أو the cat. في الجملة المثبتة نضيف علامة s إلى الفعل مع هذه المجموعة.',
          'قارن: I play = أنا ألعب، لكن He plays = هو يلعب. المعنى لم يتغير؛ الذي تغيّر هو شكل الفعل لأن الفاعل أصبح he. لا تحفظها عشوائيًا: اسأل نفسك هل الفاعل he/she/it أو اسم مفرد؟',
          'القاعدة الأساسية للكتابة: أغلب الأفعال نضيف لها s فقط: read → reads، work → works، eat → eats. مثال: She reads a book = هي تقرأ كتابًا.',
          'إذا انتهى الفعل غالبًا بـ sh أو ch أو ss أو x أو z أو o نضيف es: watch → watches، wash → washes، fix → fixes، go → goes. وبعض الأفعال المنتهية بـ z نضاعف z: quiz → quizzes. مثال: He watches TV = هو يشاهد التلفاز.',
          'إذا انتهى الفعل بحرف ساكن ثم y، نحذف y ونكتب ies: study → studies، try → tries. لكن إذا كان قبل y حرف علة (a/e/i/o/u) نضيف s فقط: play → plays، enjoy → enjoys.',
          'انتبه: have فعل غير منتظم مع he/she/it ويتحول إلى has: I have a book / She has a book. وفعل be له قاعدة خاصة (am/is/are) وتتعلمه في درس مستقل.',
          'في النفي لا نقول She not plays. نستخدم doesn’t مع he/she/it، ثم نكتب الفعل الأساسي دون s: She doesn’t play. ومع I/you/we/they نستخدم don’t: They don’t play.',
          'في السؤال نبدأ بـ Does مع he/she/it أو Do مع I/you/we/they: Does he play? / Do they play? وبعد does لا تضع s على الفعل؛ لأن علامة الشخص موجودة في does.',
          'تذكّر الفرق المهم: He plays (إثبات: s على الفعل)، He doesn’t play (نفي: s في doesn’t والفعل play كما هو)، Does he play? (سؤال: s في does والفعل play كما هو).',
          'خطوات الحل: 1) حدّد الفاعل. 2) هل الجملة إثبات أم نفي أم سؤال؟ 3) في الإثبات فقط افحص هل الفاعل he/she/it أو اسم مفرد لتضيف s/es/ies. 4) مع do/does استخدم الفعل الأساسي.'
        ]:activeLesson.steps;
        lessonSteps.forEach((line,index)=>{
          const item=safeText('article','step');
          item.append(safeText('span','step-no',index+1),safeText('p','',line));
          steps.append(item);
        });
        formula.append(steps);stageElements.push(formula);stageContainer.append(formula);

        const examples=renderExamples(activeLesson.examples);stageElements.push(examples);stageContainer.append(examples);

        const mistake=makeSection('mistake','🛑','ثالثًا: انتبه من هذا الخطأ','قارن بين الجملة غير الصحيحة والصيغة الصحيحة.');
        const mistakeCard=safeText('div','mistake');
        const comparison=safeText('div','mistake-grid');
        const wrong=safeText('div','mistake-side wrong');
        wrong.append(safeText('small','','✕ لا تقل'),safeText('div','mistake-text',activeLesson.mistake.wrong));
        const right=safeText('div','mistake-side correct');
        right.append(safeText('small','','✓ قل'),safeText('div','mistake-text',activeLesson.mistake.right));
        comparison.append(wrong,right);
        mistakeCard.append(comparison,safeText('p','why',activeLesson.mistake.why));
        mistake.append(mistakeCard);stageElements.push(mistake);stageContainer.append(mistake);

        const tip=safeText('aside','tip-card');
        tip.id='tip';tip.classList.add('section','lesson-stage');
        tip.append(safeText('span','tip-icon','✨'),safeText('p','',activeLesson.tip));
        stageElements.push(tip);stageContainer.append(tip);
        const presentSimpleQuestions=[
          {text:'My brother ___ football every Friday.',options:['play','plays','playing'],answer:1,explain:'My brother شخص واحد، ويمكن استبداله بـ he؛ لذلك نضيف s: plays.'},
          {text:'Mona ___ English every day.',options:['study','studies','studys'],answer:1,explain:'Mona اسم مفرد، والفعل study ينتهي بحرف ساكن + y؛ نحذف y ونضيف ies.'},
          {text:'They ___ to school by bus.',options:['goes','go','going'],answer:1,explain:'They من المجموعة الأولى؛ نستخدم الفعل الأساسي go دون s.'},
          {text:'He doesn’t ___ coffee.',options:['drinks','drink','drinking'],answer:1,explain:'بعد doesn’t نستخدم الفعل الأساسي دون s: drink.'},
          {text:'___ your sister like reading?',options:['Do','Does','Is'],answer:1,explain:'your sister مفرد ويمكن استبدالها بـ she؛ لذلك نبدأ السؤال بـ Does.'},
          {text:'اختر الجملة الصحيحة:',options:['She watch TV.','She watches TV.','She watching TV.'],answer:1,explain:'مع she في الإثبات نضيف es لأن watch تنتهي بـ ch.'}
        ];
        const challenge=renderQuiz(activeLesson.slug==='g-present-simple'?presentSimpleQuestions:activeLesson.questions);
        stageElements.push(challenge);stageContainer.append(challenge);
        setActiveStep(0,false);
        root.append(controls);

        const nav=safeText('nav','bottom-nav');
        nav.setAttribute('aria-label','التنقل بين الدروس');
        if(previous){
          const a=safeText('a','lesson-neighbor','');
          a.href='./grammar-lesson.html#'+previous.slug;
          a.append(safeText('small','','الدرس السابق'),safeText('strong','',previous.title));
          nav.append(a);
        } else {
          const a=safeText('a','lesson-neighbor','');
          a.href='./index.html';
          a.append(safeText('small','','الرئيسية'),safeText('strong','','العودة إلى الرئيسية'));
          nav.append(a);
        }
        if(following){
          const a=safeText('a','lesson-neighbor next','');
          a.href='./grammar-lesson.html#'+following.slug;
          a.append(safeText('small','','الدرس التالي ←'),safeText('strong','',following.title));
          nav.append(a);
        } else {
          const a=safeText('a','lesson-neighbor next','');
          a.href='./index.html';
          a.append(safeText('small','','انتهيت من هذا المسار'),safeText('strong','','العودة إلى الرئيسية'));
          nav.append(a);
        }
        root.append(nav);
        root.append(safeText('p','note','تدرّب بهدوء. نتيجة التحدّي تساعدك على معرفة ما تحتاج إلى مراجعته، ولا تعني وحدها أنك أتقنت القاعدة.'));
      }

      $('backButton').addEventListener('click',()=>{
        if(document.referrer){
          try{
            const previous=new URL(document.referrer);
            if(previous.origin===location.origin){history.back();return;}
          }catch(_){}
        }
        location.href='./index.html';
      });
      window.addEventListener('hashchange',renderLesson);
      renderLesson();
    })();
  </script>
