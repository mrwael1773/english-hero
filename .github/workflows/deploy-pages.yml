name: Deploy English Hero to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check application files and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s config.js
          test -s cloud-sync.js
          test -s privacy.html
          test -s contact.html
          node --check cloud-sync.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, re.I | re.S)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit('No inline application script found')
          Path('/tmp/english-hero-inline.js').write_text(scripts[0], encoding='utf-8')
          config = Path('config.js').read_text(encoding='utf-8')
          if 'YOUR_PROJECT' in config or 'YOUR_SUPABASE' in config or 'placeholder' in config.lower():
              raise SystemExit('Supabase configuration contains a placeholder')
          print('Application files and Supabase config checks passed.')
          PY
          node --check /tmp/english-hero-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
