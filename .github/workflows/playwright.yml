name: Playwright browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep only the newest run for a branch/PR; avoid duplicate push + PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency security advisories
        shell: bash
        run: |
          npm audit --json > /tmp/english-hero-npm-audit.json || true
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/english-hero-npm-audit.json', 'utf8'));
          const summary = report.metadata?.vulnerabilities || {};
          console.log('NPM audit summary:', JSON.stringify(summary));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = (item.via || []).map(entry => typeof entry === 'string' ? entry : entry.title).join('; ');
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories: via
            }));
          }
          const blocking = (summary.moderate || 0) + (summary.high || 0) + (summary.critical || 0);
          if (blocking > 0) {
            console.error(`Dependency audit failed: ${blocking} moderate/high/critical advisories remain.`);
            process.exit(1);
          }
          JS
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: npm run test:e2e
