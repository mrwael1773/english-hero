name: Local Supabase migration tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/local-supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-supabase:
    name: Apply all migrations to isolated local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase stack
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor

      - name: Apply every migration to a clean local database
        run: supabase db reset --local

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
