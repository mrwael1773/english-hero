name: English Hero quality checks

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('manifest.webmanifest: valid JSON')"
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          node --check config.js
          node --check cloud-sync.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b(?![^>]*\bsrc\s*=)[^>]*>(.*?)</script\s*>', html, re.I | re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found in index.html')
          for i, script in enumerate(scripts, 1):
              path = Path(f'/tmp/english-hero-inline-{i}.js')
              path.write_text(script, encoding='utf-8')
              print(f'Extracted inline script {i}: {len(script)} characters')
          PY
          for file in /tmp/english-hero-inline-*.js; do node --check "$file"; done
      - name: Check duplicate HTML IDs
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid\s*=\s*["\']([^"\']+)["\']', html, re.I)
          duplicates = sorted(k for k, count in Counter(ids).items() if count > 1)
          if duplicates:
              raise SystemExit('Duplicate IDs: ' + ', '.join(duplicates))
          print(f'index.html: {len(ids)} unique IDs')
          PY
