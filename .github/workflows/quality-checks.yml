name: English Hero quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: English Hero quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          inline_count = 0
          for page_path in ["index.html", "grammar-lesson.html"]:
              html = Path(page_path).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\\b([^>]*)>([\\s\\S]*?)</script\\s*>", html, re.I)
              for attrs, script in scripts:
                  # JSON-LD is structured data, not JavaScript; external scripts are checked separately.
                  if "src=" in attrs.lower() or "application/ld+json" in attrs.lower():
                      continue
                  if script.strip():
                      inline_count += 1
                      Path(f"/tmp/english-hero-inline-{inline_count}.js").write_text(script, encoding="utf-8")
          if not inline_count:
              raise SystemExit("No inline JavaScript blocks found in project HTML pages")
          print(f"Extracted {inline_count} inline JavaScript block(s) from project HTML pages.")
          PY
          for file in /tmp/english-hero-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          node --check config.js
          node --check cloud-sync.js
          node --check sw.js
          node --check pro-dashboard.js
          node --check learning-expansion.js
          node --check english-hero-plus.js
          node --check grammar-lessons.js

      - name: Validate JSON data and vocabulary count
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !manifest.scope || !Array.isArray(manifest.icons)) {
            throw new Error('manifest.webmanifest is missing required app fields');
          }

          const vocab = JSON.parse(fs.readFileSync('vocabulary-20000.json', 'utf8'));
          if (!Array.isArray(vocab.words)) throw new Error('Vocabulary data must contain a words array');
          if (vocab.count !== vocab.words.length) {
            throw new Error(`Vocabulary count mismatch: metadata says ${vocab.count}, file contains ${vocab.words.length}`);
          }
          const normalized = vocab.words.map(word => String(word).trim().toLowerCase());
          if (normalized.some(word => !word)) throw new Error('Vocabulary contains an empty word');
          if (new Set(normalized).size !== normalized.length) throw new Error('Vocabulary contains duplicate words');
          console.log(`Validated ${normalized.length} unique vocabulary entries.`);
          console.log(`Validated manifest for ${manifest.name}.`);
          JS

      - name: Check essential app files
        run: |
          test -s index.html
          test -s sw.js
          test -s config.js
          test -s cloud-sync.js
          test -s manifest.webmanifest
          test -s vocabulary-20000.json
          test -s icon.svg
          grep -q 'لا تكتفِ بحفظ الكلمات' index.html
          grep -q 'English Hero' index.html
