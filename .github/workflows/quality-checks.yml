name: English Hero quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: English Hero quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          inline_count = 0
          for page_path in ["index.html", "grammar-lesson.html", "mentor-dashboard.html"]:
              html = Path(page_path).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script\s*>", html, re.I)
              for attrs, script in scripts:
                  # JSON-LD is structured data, not JavaScript; external scripts are checked separately.
                  if "src=" in attrs.lower() or "application/ld+json" in attrs.lower():
                      continue
                  if script.strip():
                      inline_count += 1
                      Path(f"/tmp/english-hero-inline-{inline_count}.js").write_text(script, encoding="utf-8")
          if not inline_count:
              raise SystemExit("No inline JavaScript blocks found in project HTML pages")
          print(f"Extracted {inline_count} inline JavaScript block(s) from project HTML pages.")
          PY
          for file in /tmp/english-hero-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          node --check config.js
          node --check cloud-sync.js
          node --check auth-gateway.js
          node --check auth-guard.js
          node --check sw.js
          node --check pro-dashboard.js
          node --check learning-expansion.js
          node --check champions.js
          node --check english-hero-plus.js
          node --check grammar-lessons.js
          node --check tests/integration/student-username-login.test.mjs

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check username login Edge Function
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/student-username-login/index.ts

      - name: Type-check mentor overview Edge Function
        run: deno check --no-lock supabase/functions/mentor-overview/index.ts

      - name: Test mentor overview Edge Function
        run: deno test --no-lock --allow-env supabase/functions/mentor-overview/index_test.ts

      - name: Validate JSON data and vocabulary count
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !manifest.scope || !Array.isArray(manifest.icons)) {
            throw new Error('manifest.webmanifest is missing required app fields');
          }

          const vocab = JSON.parse(fs.readFileSync('vocabulary-20000.json', 'utf8'));
          if (!Array.isArray(vocab.words)) throw new Error('Vocabulary data must contain a words array');
          if (vocab.count !== vocab.words.length) {
            throw new Error(`Vocabulary count mismatch: metadata says ${vocab.count}, file contains ${vocab.words.length}`);
          }
          const normalized = vocab.words.map(word => String(word).trim().toLowerCase());
          if (normalized.some(word => !word)) throw new Error('Vocabulary contains an empty word');
          if (new Set(normalized).size !== normalized.length) throw new Error('Vocabulary contains duplicate words');
          console.log(`Validated ${normalized.length} unique vocabulary entries.`);
          console.log(`Validated manifest for ${manifest.name}.`);
          JS

      - name: Check essential app files
        run: |
          test -s index.html
          test -s sw.js
          test -s config.js
          test -s cloud-sync.js
          test -s champions.js
          test -s champions.css
          test -s auth-gateway.js
          test -s auth-gateway.css
          test -s auth-guard.js
          test -s supabase/functions/student-username-login/index.ts
          test -s supabase/functions/mentor-overview/index.ts
          test -s manifest.webmanifest
          test -s vocabulary-20000.json
          test -s icon.svg
          grep -q 'لا تكتفِ بحفظ الكلمات' index.html
          grep -q 'English Hero' index.html

  mentor-postgres-integration:
    name: Mentor PostgreSQL migration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Bootstrap isolated synthetic database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/mentor-bootstrap.sql

      - name: Apply mentor migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for migration in \
            supabase/migrations/20261118100000_student_activity_and_mentor_overview.sql \
            supabase/migrations/20261118110000_mentor_passwordless_link_access.sql \
            supabase/migrations/20261121010000_atomic_mentor_overview_access.sql \
            supabase/migrations/20261121100000_mentor_learning_activity_summary.sql \
            supabase/migrations/20261121120000_mentor_comprehensive_progress_summary.sql \
            supabase/migrations/20261121143000_student_champions_leaderboard.sql \
            supabase/migrations/20261121150000_student_champions_improvement_category.sql \
            supabase/migrations/20261121180000_harden_student_champion_lesson_indices.sql \
            supabase/migrations/20261121193000_champions_mastery_uses_event_ledger.sql
          do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify mentor access controls and student activity behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/mentor-migrations.test.sql

  local-supabase-migrations:
    name: Full local Supabase migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Set up Supabase CLI
        id: setup_supabase_cli
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start isolated local Supabase stack
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor

      - name: Apply every migration to a clean local database
        run: supabase db reset --local

      - name: Test username Auth HTTP and learner data isolation
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source <(supabase status -o env)
          set +a

          : "${API_URL:?Supabase local API URL was not reported}"
          : "${ANON_KEY:?Supabase local anon key was not reported}"
          : "${SERVICE_ROLE_KEY:?Supabase local service role key was not reported}"
          : "${DB_URL:?Supabase local database URL was not reported}"

          export ALLOWED_ORIGIN="http://localhost:3000"
          cat > /tmp/english-hero-edge-test.env <<EOF
          SUPABASE_URL=${API_URL}
          SUPABASE_ANON_KEY=${ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          ENGLISH_HERO_ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
          EOF

          supabase functions serve student-username-login \
            --env-file /tmp/english-hero-edge-test.env \
            --no-verify-jwt > /tmp/english-hero-edge-function.log 2>&1 &
          echo $! > /tmp/english-hero-edge-function.pid

          ready=0
          for attempt in $(seq 1 45); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Origin: ${ALLOWED_ORIGIN}" \
              "${API_URL}/functions/v1/student-username-login" || true)
            if [ "${status}" = "405" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready}" != "1" ]; then
            cat /tmp/english-hero-edge-function.log
            echo "Local username login Edge Function did not become ready."
            exit 1
          fi

          export API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL ALLOWED_ORIGIN
          node tests/integration/student-username-login.test.mjs

      - name: Stop local Supabase stack
        if: always() && steps.setup_supabase_cli.outcome == 'success'
        run: supabase stop --no-backup
