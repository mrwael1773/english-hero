name: English Hero quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Validate app files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline and standalone JavaScript across the site
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          html_files = [
              "index.html",
              "teacher-pilot.html",
              "english-basics.html",
              "english-tenses-guide.html",
              "privacy.html",
              "contact.html",
              "german.html",
              "german-hero/index.html",
          ]
          count = 0
          for html_path in html_files:
              path = Path(html_path)
              if not path.is_file():
                  continue
              html = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script\s*>", html, re.I)
              for attrs, script in scripts:
                  if "src=" in attrs.lower() or "application/ld+json" in attrs.lower():
                      continue
                  if not script.strip():
                      continue
                  count += 1
                  output = Path(f"/tmp/english-hero-inline-{count}.js")
                  output.write_text(script, encoding="utf-8")
                  print(f"Extracted {html_path} inline script #{count}.")
          if count == 0:
              raise SystemExit("No inline JavaScript blocks were found.")
          PY
          for file in /tmp/english-hero-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          for file in config.js cloud-sync.js sw.js english-hero-plus.js learning-expansion.js pro-dashboard.js writing-practice.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate JSON data and vocabulary count
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          if (!manifest.name || !manifest.start_url || !manifest.scope || !Array.isArray(manifest.icons)) {
            throw new Error('manifest.webmanifest is missing required app fields');
          }

          const vocab = JSON.parse(fs.readFileSync('vocabulary-6000.json', 'utf8'));
          if (!Array.isArray(vocab.words)) throw new Error('Vocabulary data must contain a words array');
          if (vocab.count !== vocab.words.length) {
            throw new Error(`Vocabulary count mismatch: metadata says ${vocab.count}, file contains ${vocab.words.length}`);
          }
          const normalized = vocab.words.map(word => String(word).trim().toLowerCase());
          if (normalized.some(word => !word)) throw new Error('Vocabulary contains an empty word');
          if (new Set(normalized).size !== normalized.length) throw new Error('Vocabulary contains duplicate words');
          console.log(`Validated ${normalized.length} unique vocabulary entries.`);
          console.log(`Validated manifest for ${manifest.name}.`);
          JS

      - name: Check essential app files
        run: |
          test -s index.html
          test -s sw.js
          test -s config.js
          test -s cloud-sync.js
          test -s manifest.webmanifest
          test -s vocabulary-6000.json
          test -s icon.svg
          grep -q 'لا تكتفِ بحفظ الكلمات' index.html
          grep -q 'English Hero' index.html
